<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Senha — Canal Educação</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="logo">📡</div>
                <h1>Recuperar Senha</h1>
                <p>Insira seu email para recuperar o acesso</p>
            </div>

            <form id="forgot-form" onsubmit="handleForgot(event)">
                <div class="form-group">
                    <label class="form-label" for="email">Email</label>
                    <input type="email" id="email" class="form-input" placeholder="seu.email@exemplo.com" required>
                </div>

                <div id="forgot-msg"
                    style="display: none; font-size: 0.85rem; margin-bottom: 1rem; text-align: center; padding: 0.5rem; border-radius: 4px;">
                </div>

                <button type="submit" class="btn btn-primary btn-full" id="forgot-btn">
                    Enviar Link de Recuperação
                </button>
            </form>

            <div style="text-align: center; margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid var(--border-subtle);">
                <p style="font-size: 0.8rem; color: var(--text-muted);">
                    Lembrou da senha? <a href="/login" style="color: var(--text-accent);">Voltar ao login</a>
                </p>
            </div>
        </div>
    </div>

    <script>
        async function handleForgot(e) {
            e.preventDefault();
            const btn = document.getElementById('forgot-btn');
            const msgEl = document.getElementById('forgot-msg');
            msgEl.style.display = 'none';
            btn.disabled = true;
            btn.textContent = 'Enviando...';

            const email = document.getElementById('email').value;

            try {
                const res = await fetch('/api/v1/auth/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email }),
                });

                const data = await res.json();
                
                msgEl.textContent = data.message || 'Se o email estiver registado, enviámos um link.';
                msgEl.style.backgroundColor = 'var(--bg-hover)';
                msgEl.style.color = 'var(--text-primary)';
                msgEl.style.display = 'block';
                btn.textContent = 'Email Enviado';
            } catch (err) {
                msgEl.textContent = 'Erro de conexão. Tente novamente mais tarde.';
                msgEl.style.backgroundColor = '#fef2f2';
                msgEl.style.color = '#dc2626';
                msgEl.style.display = 'block';
                btn.disabled = false;
                btn.textContent = 'Enviar Link de Recuperação';
            }
        }
    </script>
</body>

</html>
