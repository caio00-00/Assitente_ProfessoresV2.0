<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Definir Nova Senha — Canal Educação</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="logo">🔐</div>
                <h1>Nova Senha</h1>
                <p>Crie uma nova senha para a sua conta</p>
            </div>

            <form id="reset-form" onsubmit="handleReset(event)">
                <div class="form-group">
                    <label class="form-label" for="password">Nova Senha (mínimo 6 caracteres)</label>
                    <input type="password" id="password" class="form-input" placeholder="••••••••" required minlength="6">
                </div>

                <div class="form-group">
                    <label class="form-label" for="confirm_password">Confirmar Nova Senha</label>
                    <input type="password" id="confirm_password" class="form-input" placeholder="••••••••" required minlength="6">
                </div>

                <div id="reset-msg"
                    style="display: none; font-size: 0.85rem; margin-bottom: 1rem; text-align: center; padding: 0.5rem; border-radius: 4px;">
                </div>

                <button type="submit" class="btn btn-primary btn-full" id="reset-btn">
                    Definir Nova Senha
                </button>
            </form>
        </div>
    </div>

    <script>
        async function handleReset(e) {
            e.preventDefault();
            const btn = document.getElementById('reset-btn');
            const msgEl = document.getElementById('reset-msg');
            msgEl.style.display = 'none';

            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm_password').value;

            if (password !== confirmPassword) {
                msgEl.textContent = 'As senhas não coincidem.';
                msgEl.style.backgroundColor = '#fef2f2';
                msgEl.style.color = '#dc2626';
                msgEl.style.display = 'block';
                return;
            }

            btn.disabled = true;
            btn.textContent = 'A processar...';

            // Get token from URL
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');

            if (!token) {
                msgEl.textContent = 'Token de recuperação ausente. O link pode ser inválido.';
                msgEl.style.backgroundColor = '#fef2f2';
                msgEl.style.color = '#dc2626';
                msgEl.style.display = 'block';
                btn.textContent = 'Erro';
                return;
            }

            try {
                const res = await fetch('/api/v1/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, password }),
                });

                if (!res.ok) {
                    const data = await res.json();
                    throw new Error(data.detail || 'Erro ao redefinir senha.');
                }

                msgEl.textContent = 'Senha redefinida com sucesso! Redirecionando para login...';
                msgEl.style.backgroundColor = '#ecfdf5';
                msgEl.style.color = '#059669';
                msgEl.style.display = 'block';
                btn.textContent = 'Sucesso';

                setTimeout(() => {
                    window.location.href = '/login';
                }, 3000);
            } catch (err) {
                msgEl.textContent = err.message;
                msgEl.style.backgroundColor = '#fef2f2';
                msgEl.style.color = '#dc2626';
                msgEl.style.display = 'block';
                btn.disabled = false;
                btn.textContent = 'Definir Nova Senha';
            }
        }
    </script>
</body>

</html>
