{% extends "base.html" %}
{% block title %}Minha escala — Canal Educação{% endblock %}

{% block head %}
<style>
    .dg-toolbar { display: flex; flex-wrap: wrap; gap: 0.6rem; align-items: center; justify-content: space-between; margin-bottom: 1rem; }
    .dg-toolbar .grupo { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; }
    .dg-toolbar .form-input, .dg-toolbar .form-select { width: auto; padding: 0.45rem 0.7rem; }
    .dg-dia { font-size: 1.05rem; font-weight: 600; margin-left: 0.4rem; }
    .dg-btn-icon { width: 36px; padding: 0.45rem 0; justify-content: center; }
    .dg-estudio { padding: 1rem; margin-bottom: 1.25rem; }
    .dg-estudio-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; flex-wrap: wrap; margin-bottom: 0.75rem; }
    .dg-estudio-nome { font-size: 1.15rem; font-weight: 700; }
    .dg-estudio-sub { font-size: 0.8rem; color: var(--text-muted); }
    .dg-transmissao { border: 1px solid var(--border-subtle); border-radius: var(--radius-sm); padding: 0.6rem 0.75rem; min-width: 300px; flex: 1; max-width: 560px; }
    .dg-transmissao .titulo { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-muted); margin-bottom: 0.4rem; }
    .dg-campo { display: flex; gap: 0.4rem; align-items: center; margin-bottom: 0.35rem; }
    .dg-campo label { font-size: 0.75rem; color: var(--text-secondary); width: 54px; flex: 0 0 auto; }
    .dg-campo input { flex: 1; min-width: 0; font-family: ui-monospace, monospace; font-size: 0.8rem; padding: 0.35rem 0.5rem; }
    .dg-vazio { font-size: 0.8rem; color: var(--text-muted); }
    .dg-tabela td, .dg-tabela th { padding: 0.5rem 0.6rem; vertical-align: middle; }
    .dg-tag { display: inline-block; font-size: 0.65rem; font-weight: 700; padding: 1px 6px; border-radius: 4px; color: #fff; }
    .dg-cancelada td { opacity: 0.55; }
    .dg-cancelada .dg-disc { text-decoration: line-through; }
    .dg-status { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 0.7rem; font-weight: 600; color: #fff; white-space: nowrap; }
</style>
{% endblock %}

{% block content %}
<div class="page-header">
    <div>
        <h1 class="page-title"><svg class="ico ico-titulo"><use href="#i-calendario"/></svg> Minha escala</h1>
        <p class="page-subtitle">Os estúdios e turnos em que você está escalado no dia, com as aulas de cada um.</p>
    </div>
</div>

<div class="dg-toolbar">
    <div class="grupo">
        <button class="btn btn-secondary btn-sm dg-btn-icon" onclick="mudarDia(-1)" title="Dia anterior">◀</button>
        <input type="date" id="dg-data" class="form-input" onchange="carregar()">
        <button class="btn btn-secondary btn-sm dg-btn-icon" onclick="mudarDia(1)" title="Próximo dia">▶</button>
        <button class="btn btn-secondary btn-sm" onclick="irHoje()">Hoje</button>
        <span class="dg-dia" id="dg-dia"></span>
    </div>
    <div class="grupo" id="dg-escolha-diretor" style="display:none;">
        <label style="font-size: 0.8rem; color: var(--text-secondary);">Diretor</label>
        <select id="dg-diretor" class="form-select" onchange="carregar()"></select>
    </div>
</div>

<div class="tabs" id="dg-abas" style="margin-bottom: 1rem; display:none;"></div>
<div id="dg-conteudo"><div class="spinner"></div></div>
{% endblock %}

{% block scripts %}
<script>
    const API = '/api/v1/agenda-estudios';
    const TURNO_ICONE = { manha: '☀️', tarde: '🌤️', noite: '🌙' };
    const TURNO_LABEL = { manha: 'Manhã', tarde: 'Tarde', noite: 'Noite' };
    const STATUS = {
        RASCUNHO: ['📝 Rascunho', '#64748b'], AGUARDANDO_VALIDACAO: ['⏳ Aguardando validação', '#d97706'],
        VALIDADO: ['✅ Validado', '#059669'], FINALIZADO: ['✔️ Finalizado', '#059669'], CANCELADO: ['🚫 Cancelado', '#dc2626'],
    };
    let DADOS = null, MEUS = [], turnoAtivo = null, PODE_ESCOLHER = false;

    const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    function hojeIso() { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; }
    function somarDias(iso, n) { const [a, m, d] = iso.split('-').map(Number); const x = new Date(a, m - 1, d + n); return `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, '0')}-${String(x.getDate()).padStart(2, '0')}`; }
    function br(iso) { const [a, m, d] = String(iso).split('-'); return `${d}/${m}/${a}`; }
    function dataAtual() { return document.getElementById('dg-data').value || hojeIso(); }
    function mudarDia(n) { document.getElementById('dg-data').value = somarDias(dataAtual(), n); carregar(); }
    function irHoje() { document.getElementById('dg-data').value = hojeIso(); carregar(); }
    function turnoAgora() {
        const d = new Date(), m = d.getHours() * 60 + d.getMinutes();
        return m < 12 * 60 + 20 ? 'manha' : (m < 18 * 60 + 20 ? 'tarde' : 'noite');
    }

    async function api(url) {
        const res = await fetch(url, { headers: { 'Authorization': `Bearer ${getToken()}` } });
        if (res.status === 401) { logout(); throw new Error('Sessão expirada.'); }
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error((data && data.detail && (data.detail.message || data.detail)) || 'Erro ao carregar.');
        return data;
    }

    document.addEventListener('DOMContentLoaded', async () => {
        await loadUserProfile();
        const user = getUser();
        if (!user || !['admin', 'diretor_chefe', 'diretor_imagem'].includes(user.role)) {
            window.location.replace('/grade');
            return;
        }
        PODE_ESCOLHER = ['admin', 'diretor_chefe'].includes(user.role);
        if (PODE_ESCOLHER) {
            try {
                const dirs = await api('/api/v1/reports/lookup/diretores');
                document.getElementById('dg-diretor').innerHTML = '<option value="">Eu</option>' +
                    dirs.map(d => `<option value="${d.id}">${esc(d.nome)}</option>`).join('');
                document.getElementById('dg-escolha-diretor').style.display = '';
            } catch (e) { /* segue sem a escolha */ }
        }
        const p = new URLSearchParams(location.search);
        document.getElementById('dg-data').value = p.get('data') || hojeIso();
        carregar();
    });

    let seq = 0;
    async function carregar() {
        const data = dataAtual(), s = ++seq;
        const dir = PODE_ESCOLHER ? document.getElementById('dg-diretor').value : '';
        const alvo = document.getElementById('dg-conteudo');
        alvo.innerHTML = '<div class="spinner"></div>';
        history.replaceState(null, '', `?data=${data}`);
        try {
            const q = new URLSearchParams({ data });
            if (dir) q.set('diretor_id', dir);
            const dados = await api(`${API}/minha-escala?${q}`);
            let meus = [];
            try {
                const r = await api(`/api/v1/image-director/?data_inicio=${data}&data_fim=${data}&limit=200`);
                meus = (r.items || []).filter(x => x.diretor_imagem_id === dados.diretor.id);
            } catch (e) { meus = []; }
            if (s !== seq) return;
            DADOS = dados; MEUS = meus;
            const turnos = dados.turnos.map(t => t.turno);
            if (!turnos.includes(turnoAtivo)) turnoAtivo = turnos.includes(turnoAgora()) && data === hojeIso() ? turnoAgora() : turnos[0];
            render();
        } catch (e) {
            if (s !== seq) return;
            document.getElementById('dg-abas').style.display = 'none';
            alvo.innerHTML = `<div class="empty-state"><p>${esc(e.message)}</p></div>`;
        }
    }

    function render() {
        const d = DADOS;
        document.getElementById('dg-dia').textContent = `${d.dia_semana_label}, ${br(d.data)}${PODE_ESCOLHER ? ' · ' + d.diretor.nome : ''}`;
        const abas = document.getElementById('dg-abas');
        const alvo = document.getElementById('dg-conteudo');
        if (d.feriado) {
            abas.style.display = 'none';
            alvo.innerHTML = `<div class="empty-state"><p>🎉 Feriado: ${esc(d.feriado.nome)}.</p></div>`;
            return;
        }
        if (!d.turnos.length) {
            abas.style.display = 'none';
            alvo.innerHTML = `<div class="empty-state"><p>Você não está escalado em nenhum estúdio neste dia.</p>
                <p style="font-size:0.8rem; color:var(--text-muted);">A escala é feita pelo diretor-chefe, dia a dia.</p></div>`;
            return;
        }
        // Abas só quando está escalado em mais de um turno
        abas.style.display = d.turnos.length > 1 ? '' : 'none';
        abas.innerHTML = d.turnos.map(t => `<button class="tab-btn ${t.turno === turnoAtivo ? 'active' : ''}" onclick="trocarTurno('${t.turno}')">${TURNO_ICONE[t.turno] || ''} ${esc(t.label)}</button>`).join('');
        const t = d.turnos.find(x => x.turno === turnoAtivo) || d.turnos[0];
        alvo.innerHTML = t.estudios.map(c => renderEstudio(t, c)).join('');
    }
    function trocarTurno(t) { turnoAtivo = t; render(); }

    function campoCopiar(rotulo, valor, id, secreto) {
        if (!valor) return `<div class="dg-campo"><label>${rotulo}</label><span class="dg-vazio">Não informado pelo diretor-chefe</span></div>`;
        return `<div class="dg-campo"><label>${rotulo}</label>
            <input id="${id}" class="form-input" type="${secreto ? 'password' : 'text'}" value="${esc(valor)}" readonly>
            ${secreto ? `<button class="btn btn-secondary btn-sm" title="Mostrar/ocultar" onclick="const i=document.getElementById('${id}'); i.type = i.type === 'password' ? 'text' : 'password'">👁️</button>` : ''}
            <button class="btn btn-primary btn-sm" onclick="copiar('${id}')">Copiar</button></div>`;
    }
    async function copiar(id) {
        const v = document.getElementById(id).value;
        try { await navigator.clipboard.writeText(v); showToast('Copiado.', 'success'); }
        catch (e) {
            const i = document.getElementById(id); const tp = i.type; i.type = 'text'; i.select();
            document.execCommand('copy'); i.type = tp; showToast('Copiado.', 'success');
        }
    }

    function meuRelatorio(it) {
        return MEUS.find(r => r.turma_id === it.turma_id && (
            (r.start_time && r.start_time.substring(0, 5) === it.inicio) ||
            (r.horario_faixa && r.horario_faixa.startsWith(it.inicio)) ||
            (it.ordinal && r.horario_aula === it.ordinal))) || null;
    }

    function linkRelatorio(t, c, it) {
        const q = new URLSearchParams({
            locked: '1', data: DADOS.data, turno: TURNO_LABEL[t.turno] || '', turma: it.turma_id || '',
            horario: `${it.inicio} às ${it.fim}`, estudio: c.estudio_nome,
        });
        if (it.disciplina_id) q.set('disciplina_id', it.disciplina_id);
        if (it.professor_id) q.set('professor_id', it.professor_id);
        if (it.titulo) q.set('disciplina_nome', it.titulo);
        if (it.professor) q.set('professor_nome', it.professor);
        // Aula marcada na Agenda (antecipada, reposição…): o relatório usa esse agendamento
        if (it.tipo !== 'AULA' && it.agendamento_id) q.set('agenda', it.agendamento_id);
        return `/diretor-imagem?${q}`;
    }

    function renderEstudio(t, c) {
        const sub = [c.turmas && c.turmas.length ? c.turmas.join(' · ') : '',
            (c.trocas || []).length ? c.diretor + c.trocas.map(x => ` → ${x.nome || ''}${x.a_partir ? ' (a partir das ' + x.a_partir + ')' : ''}`).join('') : ''].filter(Boolean).join(' — ');
        const linhas = c.itens.map(it => {
            const aula = it.tipo === 'AULA';
            const rel = aula || it.turma_id ? meuRelatorio(it) : null;
            const tag = it.cancelada ? '<span class="dg-tag" style="background:#dc2626;">CANCELADA</span>'
                : it.remanejada ? `<span class="dg-tag" style="background:#b45309;">REMANEJADA do ${esc(it.remanejada_de)}</span>`
                : !aula ? `<span class="dg-tag" style="background:${it.cor || '#2563eb'};">${esc(it.tipo_label || it.tipo)}</span>` : '';
            let acao = '';
            if (it.cancelada) acao = '<span class="dg-vazio">—</span>';
            else if (rel) acao = `<a class="btn btn-secondary btn-sm" href="/diretor-imagem?id=${rel.id}">Abrir</a>`;
            else if (aula || it.turma_id) acao = `<a class="btn btn-primary btn-sm" href="${linkRelatorio(t, c, it)}">Lançar relatório</a>`;
            else if (it.tipo === 'EVENTO') acao = `<a class="btn btn-secondary btn-sm" href="/diretor-imagem?tipo=evento">Relatório de evento</a>`;
            const st = rel ? (STATUS[rel.status] || [rel.status, '#64748b']) : null;
            return `<tr class="${it.cancelada ? 'dg-cancelada' : ''}">
                <td style="white-space:nowrap;"><b>${it.inicio}–${it.fim}</b>${it.ordinal ? `<div class="dg-vazio">${esc(it.ordinal)}</div>` : ''}</td>
                <td>${esc(aula ? it.turma : (it.turma || '—'))}</td>
                <td class="dg-disc"><b>${esc(it.titulo)}</b> ${tag}</td>
                <td>${esc(it.professor || '—')}</td>
                <td>${st ? `<span class="dg-status" style="background:${st[1]};">${st[0]}</span>` : '<span class="dg-vazio">Sem relatório</span>'}</td>
                <td style="white-space:nowrap;">${acao}</td></tr>`;
        }).join('');
        return `<div class="card dg-estudio">
            <div class="dg-estudio-head">
                <div><div class="dg-estudio-nome">🎬 ${esc(c.estudio_nome)}</div><div class="dg-estudio-sub">${esc(t.label)} · ${t.inicio}–${t.fim}${sub ? ' · ' + esc(sub) : ''}</div></div>
                <div class="dg-transmissao"><div class="titulo">📺 Transmissão</div>
                    ${campoCopiar('Link', c.youtube_link, `yt-${t.turno}-${c.estudio_id}`, false)}
                    ${campoCopiar('Chave', c.chave_transmissao, `ch-${t.turno}-${c.estudio_id}`, true)}
                </div>
            </div>
            ${linhas ? `<div class="table-container"><table class="dg-tabela">
                <thead><tr><th>Horário</th><th>Turma</th><th>Aula</th><th>Professor</th><th>Meu relatório</th><th></th></tr></thead>
                <tbody>${linhas}</tbody></table></div>` : '<p class="dg-vazio">Nenhuma aula neste estúdio e turno.</p>'}
        </div>`;
    }
</script>
{% endblock %}
